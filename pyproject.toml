[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmorag"
version = "0.1.0"
description = "Query-adaptive retrieval and cross-stage continuous batching for RAG serving"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "datasets>=2.19",
  "numpy>=1.24,<2.0",
  "PyYAML>=6.0",
  "tiktoken>=0.7",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
runtime = [
  "faiss-cpu==1.8.0",
  "vllm==0.11.2",
]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]
all = [
  "faiss-cpu==1.8.0",
  "matplotlib>=3.8",
  "pytest>=8.0",
  "vllm==0.11.2",
]

[project.urls]
Repository = "https://github.com/Lemonandyx/anonymous-12345"

[tool.setuptools.packages.find]
include = ["harmorag*"]

[tool.setuptools.package-data]
harmorag = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
